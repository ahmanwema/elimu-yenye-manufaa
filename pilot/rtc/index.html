<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RTC Pilot (throwaway)</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 12px; background: #10151b; color: #eef2f5; }
      .banner { background: #e2b24d; color: #10151b; padding: 6px 10px; border-radius: 6px; font-weight: 600; }
      fieldset { border: 1px solid #39424c; border-radius: 8px; margin: 10px 0; }
      label { display: inline-block; margin: 4px 8px 4px 0; }
      input, select, button { font: inherit; min-height: 40px; }
      button { margin: 4px; padding: 0 12px; }
      #wb { width: 100%; height: 45vh; background: #19212a; border-radius: 8px; touch-action: none; display: block; }
      #log { font: 12px ui-monospace, monospace; max-height: 30vh; overflow: auto; white-space: pre-wrap; background: #0b0f13; padding: 6px; }
      .muted { color: #a9b4bf; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    </style>
  </head>
  <body>
    <p class="banner">THROWAWAY PILOT — development only. Not the Elimu app. No real users or data.</p>

    <fieldset>
      <legend>Test context (recorded with every event)</legend>
      <label>Provider <select id="provider"><option value="livekit">LiveKit</option><option value="agora">Agora</option></select></label>
      <label>Network
        <select id="network">
          <option value="wifi-strong">Strong Wi-Fi (real)</option>
          <option value="hotspot-average">Average mobile hotspot (real)</option>
          <option value="4g">4G mobile data (real)</option>
          <option value="weak-unstable">Weak/unstable (real)</option>
          <option value="sim-throttled">Simulated / throttled (DevTools)</option>
          <option value="automation-pc">Automated: one PC, Chrome, fake mic (real network)</option>
        </select>
      </label>
      <label>Device <input id="device" placeholder="e.g. Tecno Spark 10, Chrome 131" size="28" /></label>
      <label>Scenario <input id="scenario" placeholder="e.g. S2-run1" size="10" /></label>
    </fieldset>

    <fieldset>
      <legend>Join</legend>
      <div class="row">
        <label>Pilot code <input id="code" type="password" autocomplete="off" size="12" /></label>
        <button id="create">Teacher: create session</button>
        <label>Room <input id="room" size="44" placeholder="pilot-…" /></label>
        <button id="join">Join</button>
        <button id="leave" disabled>Leave</button>
      </div>
      <p class="muted" id="who"></p>
    </fieldset>

    <fieldset id="teacherBox" hidden>
      <legend>Teacher: raised hands / mic control</legend>
      <div id="hands" class="row"></div>
    </fieldset>

    <fieldset id="studentBox" hidden>
      <legend>Student</legend>
      <div class="row">
        <button id="hand">Raise hand</button>
        <button id="force" title="Security test: try to publish without being granted">Security test: force publish</button>
        <label><input type="checkbox" id="ignoreRevoke" /> Security test: ignore revoke (simulated modified client)</label>
      </div>
      <p class="muted" id="micState">Mic: off</p>
    </fieldset>

    <fieldset>
      <legend>Whiteboard transport</legend>
      <div class="row">
        <select id="transport"><option value="supabase-realtime">Independent: Supabase Realtime</option><option value="livekit-data">Coupled: LiveKit data channel</option></select>
        <button id="useTransport">Use transport</button>
        <button id="ping">Ping ×10 (RTT)</button>
        <button id="undo">Undo</button>
        <label><input type="checkbox" id="eraser" /> Eraser</label>
        <button id="clear">Clear</button>
        <label>Page <select id="page"><option>1</option><option>2</option></select></label>
      </div>
      <canvas id="wb"></canvas>
      <p class="muted">Teacher draws (pen/mouse/touch). Pointer type, pressure and event rate are logged per stroke.</p>
    </fieldset>

    <div id="audio" hidden></div>
    <div id="log"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
